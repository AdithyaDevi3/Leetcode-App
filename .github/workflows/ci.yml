name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:
    branches: [main, 'phase-*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluation-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --filter web... --force --no-frozen-lockfile
      - run: pnpm --filter web exec vitest run src/lib/evaluation-gold-set.test.ts src/lib/evaluation-quality.test.ts

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --filter web... --force --no-frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      # `web` imports workspace packages through their published `dist` exports.
      # Build declarations as well as runtime files so Next's typecheck sees the
      # contracts from this checkout rather than stale or missing declarations.
      - run: pnpm --filter @leetcode-app/domain build
      - run: pnpm --filter @leetcode-app/database build
      - run: pnpm --filter web build
