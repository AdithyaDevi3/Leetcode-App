name: CI

on:
  push:
    branches: [main, 'phase-*']
  # Stacked pull requests use temporary feature branches as their base. Every
  # pull request must receive the same checks regardless of that base branch.
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluation-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec vitest run src/lib/evaluation-gold-set.test.ts src/lib/evaluation-quality.test.ts

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The web package imports these workspaces through their built exports.
      - run: pnpm --filter @leetcode-app/domain build
      - run: pnpm --filter @leetcode-app/database build
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm -r test
      - run: pnpm --filter web build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @leetcode-app/domain build
      - run: pnpm --filter @leetcode-app/database build
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14
